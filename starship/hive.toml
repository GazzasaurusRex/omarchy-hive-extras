add_newline = true
command_timeout = 200
format = "[HIVE](bold red) [//](bright-black) [$username@$hostname](white) [$directory$git_branch$git_status]($style)$character"

[username]
show_always = true
style_user = "white"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bright-black"
format = "[$hostname]($style)"

[character]
error_symbol = "[ >](bold bright-red) "
success_symbol = "[ >](bold red) "

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold white"
repo_root_style = "bold red"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic bright-black"

[git_status]
format = "[$all_status]($style)"
style = "red"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = "! "
up_to_date = ""
untracked = "? "
modified = "~ "
stashed = ""
staged = "+ "
renamed = "» "
deleted = "- "
